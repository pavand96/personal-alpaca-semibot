alpaca:
  # Keep this true until you have tested the script over many market days.
  paper: true
  # IEX is available on free paper accounts. SIP usually requires a paid data plan.
  data_feed: iex

watchlist:
  - NVDA
  - AMD
  - AVGO
  - TSM
  - ASML
  - ARM
  - INTC
  - MU
  - QCOM
  - TXN
  - AMAT
  - LRCX
  - KLAC
  - MRVL
  - "ON"
  - ADI
  - NXPI
  - SNDK
  - GLW
  - WDC

strategy:
  # Buy when latest trade is this much above the previous daily close.
  buy_threshold_pct: 2.0
  # Sell an existing position when latest trade is this much below the previous daily close.
  sell_threshold_pct: -1.0
  per_trade_notional: 100.0
  max_position_notional: 500.0
  max_symbols_to_buy_per_run: 2
  min_price: 1.0
  max_price: 10000.0

risk:
  # Dry run prints/logs intended orders but does not submit them.
  dry_run: true
  require_market_open: true
  max_orders_per_run: 3
  stop_loss_pct: 8.0
  trailing_stop_pct: 15.0
  max_account_drawdown_pct: 15.0

runtime:
  interval_seconds: 300
  log_file: logs/semibot_events.csv

backtest:
  initial_cash: 10000.0
  # Compare against semiconductor stocks directly, not only broad ETFs.
  benchmark_symbols: []
  benchmark_include_watchlist: true
  benchmark_equal_weight_watchlist: true
  # Use split-adjusted bars so splits do not look like real trading gains/losses.
  bar_adjustment: split
  # 5 basis points = 0.05%. This makes simulated fills slightly worse than bar prices.
  slippage_bps: 5.0
  liquidate_at_end: true
  trades_file: logs/backtest_trades.csv

ml:
  model_path: models/semibot_model.joblib
  # Supported: logistic_regression, random_forest, hist_gradient_boosting
  model_type: logistic_regression
  # Label a row positive when the close after this many trading days is above target_return_pct.
  horizon_days: 3
  target_return_pct: 1.0
  buy_probability: 0.60
  sell_probability: 0.40
  feature_lookback_days: 30
  validation_splits: 5
  validation_gap_days: 1
  random_state: 42
  ml_trades_file: logs/ml_backtest_trades.csv
  optimizer_results_file: logs/ml_parameter_optimization.csv
  optimizer_return_drawdown_penalty: 1.5
  optimizer_trade_penalty: 0.05
  optimizer_max_trials: 80
  buy_probability_grid: [0.50, 0.55, 0.60, 0.65]
  sell_probability_grid: [0.25, 0.30, 0.35, 0.40]
  per_trade_notional_grid: [100.0, 250.0]
  max_position_notional_grid: [500.0, 1000.0, 2000.0]
  max_symbols_to_buy_per_run_grid: [2, 3]
  stop_loss_pct_grid: [6.0, 8.0, 10.0]
  trailing_stop_pct_grid: [12.0, 18.0, 25.0]
