  # Large-cap tech (MSFT, GOOGL, AMZN, TSLA, META) were removed: they move on
  # different macro drivers and dilute the sector signal.
  - NVDA
  - AMD
  - AVGO
  - TSM
  - ASML
  - ARM
  - INTC
  - MU
  - QCOM
  - TXN
  - AMAT
  - LRCX
  - KLAC
  - MRVL
  - "ON"
  - ADI
  - NXPI
  - SNDK
  - GLW
  - WDC

sector_watchlists:
  # XLE-like U.S. energy universe: integrated majors, E&P, refiners,
  # midstream, and oilfield services. No LNG/shipping one-offs here.
  energy:
    - XOM
    - CVX
    - COP
    - SLB
    - WMB
    - EOG
    - VLO
    - MPC
    - PSX
    - KMI
    - BKR
    - OKE
    - TRGP
    - OXY
    - FANG
    - EQT
    - HAL
    - DVN
    - CTRA
    - TPL
    - EXE
    - APA

  # Enterprise/application software only. Cybersecurity, cloud data,
  # gaming, and semiconductor EDA names live in their own lists.
  software:
    - MSFT
    - ORCL
    - CRM
    - ADBE
    - INTU
    - NOW
    - PLTR
    - APP
    - WDAY
    - ADSK
    - TEAM
    - DOCU
    - ZM
    - HUBS
    - BILL
    - PAYC
    - DAY
    - PCOR
    - MANH
    - TYL
    - PTC
    - FICO

  # Cybersecurity-focused universe. Avoid broad hardware/platform names
  # unless security is central to the equity story.
  cybersecurity:
    - PANW
    - CRWD
    - FTNT
    - ZS
    - OKTA
    - CYBR
    - TENB
    - S
    - NET
    - CHKP
    - QLYS
    - VRNS
    - GEN
    - RBRK
    - RDWR
    - BB

  # Quantum is still immature: pure-play quantum names first, followed by
  # major quantum-platform companies and select enabling hardware/photonics.
  quantum:
    - IONQ
    - RGTI
    - QBTS
    - QUBT
    - ARQQ
    - IBM
    - GOOGL
    - MSFT
    - AMZN
    - NVDA
    - INTC
    - HON
    - NOK
    - ERIC
    - TER
    - COHR
    - MKSI
    - TSEM

  # AI infrastructure: compute, networking, memory, foundry, equipment,
  # power/cooling, and AI server exposure.
  ai_infrastructure:
    - NVDA
    - AVGO
    - AMD
    - TSM
    - ASML
    - ARM
    - MU
    - INTC
    - LRCX
    - AMAT
    - KLAC
    - MRVL
    - ANET
    - SMCI
    - DELL
    - HPE
    - VRT
    - ETN

  # Cloud/data platforms and observability, separated from broad software.
  cloud_data:
    - MSFT
    - AMZN
    - GOOGL
    - ORCL
    - SNOW
    - MDB
    - DDOG
    - NET
    - CRWD
    - PLTR
    - ESTC
    - CFLT
    - GTLB
    - PATH
    - AI

  # Defense primes, aerospace suppliers, and publicly traded space exposure.
  defense_space:
    - LMT
    - RTX
    - NOC
    - GD
    - LHX
    - BA
    - HWM
    - TDG
    - RKLB
    - PL

strategy:
  # Buy when latest trade is this much above the previous daily close.
  buy_threshold_pct: 2.0
  # Sell an existing position when latest trade is this much below the previous daily close.
  # Implicit R:R from entry: entering at +2% and exiting at -1% (relative to the same
  # previous close) is a ~2.94% stop below the entry price — reasonable for semi stocks.
  sell_threshold_pct: -1.0
  per_trade_notional: 250.0
  max_position_notional: 1000.0
  max_symbols_to_buy_per_run: 2
  min_price: 1.0
  max_price: 10000.0

risk:
  # Dry run prints/logs intended orders but does not submit them.
  dry_run: false
  require_market_open: true
  max_orders_per_run: 3
  # ML strategy fallback only — overridden by ml.stop_loss_pct below.
  # The daily momentum strategy does NOT use this; it exits via strategy.sell_threshold_pct.
  stop_loss_pct: 5.0
  # ML strategy fallback only — overridden by ml.trailing_stop_pct below.
  # Not used by the daily momentum or intraday strategies.
  trailing_stop_pct: 10.0
  max_account_drawdown_pct: 15.0
  max_daily_loss_pct: 3.0
  flatten_on_daily_loss: true
  max_total_position_notional: 1500.0
  # ML strategy fallback only — overridden by ml.take_profit_pct below.
  take_profit_pct: 3.0
  exit_before_close: "15:55"

orders:
  type: limit
  limit_price_offset_bps: 10.0

live_entry_filter:
  enabled: true
  min_time: "09:45"
  require_above_open: true
  require_above_vwap: true
  min_open_gain_pct: 1.0
  max_open_gain_pct: 4.0
  relative_volume_min: 1.5
  average_volume_lookback_days: 20

portfolio:
  correlation_sizing_enabled: true
  correlation_lookback_days: 60
  high_correlation_threshold: 0.75
  high_correlation_notional_multiplier: 0.5
  very_high_correlation_threshold: 0.90
  very_high_correlation_notional_multiplier: 0.25
  min_correlation_adjusted_notional: 50.0

news_hold:
  enabled: true
  lookback_hours: 24
  limit_per_symbol: 5
  hold_on_any_recent_news: false
  # true: block the buy if the news API is unavailable (safer for live trading).
  # false: allow buys when news data cannot be fetched (backtest-compatible default).
  fail_closed: false
  block_keywords:
    - accounting probe
    - bankruptcy
    - class action
    - cuts guidance
    - data breach
    - delisting
    - downgrade
    - fraud
    - guidance cut
    - investigation
    - lawsuit
    - misses estimates
    - probe
    - recall
    - resigns
    - sec investigation
    - short report
    - slashes forecast
    - subpoena

buzz_earnings_overlay:
  # Optional overlay used by adaptive-semis-backtest. It boosts confirmed
  # momentum names with positive news buzz and blocks weak/negative news or
  # dangerous earnings-window setups. Missing news/earnings data fails open.
  enabled: true
  fail_open: true
  news_enabled: true
  news_lookback_days: 7
  news_fetch_chunk_days: 30
  news_limit_per_request: 50
  article_count_cap: 5
  article_weight: 0.4
  positive_keyword_weight: 1.0
  negative_keyword_weight: 2.0
  score_weight: 2.0
  max_score_boost: 20.0
  negative_score_block_threshold: -3.0
  earnings_calendar_file: data/earnings_calendar.csv
  block_new_entries_near_earnings: true
  earnings_avoid_days_before: 2
  earnings_avoid_days_after: 1
  allow_earnings_if_profit_cushion_pct: 5.0
  positive_keywords:
    - accelerates
    - ai demand
    - analyst upgrade
    - beat
    - beats
    - bullish
    - contract win
    - demand
    - earnings beat
    - guidance raised
    - raises forecast
    - record revenue
    - strong demand
    - upgrade
  negative_keywords:
    - accounting probe
    - bankruptcy
    - class action
    - cuts guidance
    - data breach
    - delisting
    - downgrade
    - earnings miss
    - fraud
    - guidance cut
    - investigation
    - lawsuit
    - miss
    - misses estimates
    - probe
    - recall
    - resigns
    - sec investigation
    - short report
    - slashes forecast
    - subpoena

runtime:
  interval_seconds: 300
  log_file: logs/semibot_events.csv

backtest:
  initial_cash: 10000.0
  # Compare against semiconductor stocks directly, not only broad ETFs.
  benchmark_symbols: []
  benchmark_include_watchlist: true
  benchmark_equal_weight_watchlist: true
  # Use split-adjusted bars so splits do not look like real trading gains/losses.
  bar_adjustment: split
  # 5 basis points = 0.05%. This makes simulated fills slightly worse than bar prices.
  slippage_bps: 5.0
  liquidate_at_end: true
  trades_file: logs/backtest_trades.csv

ml:
  model_path: models/semibot_model.joblib
  # Supported: logistic_regression, random_forest, hist_gradient_boosting
  # hist_gradient_boosting handles missing values natively and is more robust
  # to class imbalance than logistic_regression. Retrain after changing this.
  model_type: hist_gradient_boosting
  # Label a row positive when the close after this many trading days is above target_return_pct.
  horizon_days: 3
  target_return_pct: 1.0
  # 0.50 is no filter for logistic regression — the model outputs ~0.5 for uncertain rows.
  # 0.60 is a reasonable starting point; run optimize-ml-params to tune further.
  # Position sizing: fixed dollar notional OR % of current account equity.
  # per_trade_pct_of_equity scales automatically as the account grows or shrinks.
  # If set it takes precedence over per_trade_notional.
  # 0.5% of $10k = $50; keep paper testing boring until several live days look sane.
  per_trade_pct_of_equity: 0.5
  buy_probability: 0.60
  sell_probability: 0.25
  # ML-specific risk/position overrides (tuned by parameter optimizer; override global risk/strategy sections).
  stop_loss_pct: 10.0
  trailing_stop_pct: 18.0
  # Explicit take profit for the ML strategy. The 3-day prediction horizon needs room to work;
  # 1% (the former global fallback) exits too early on semiconductor moves.
  take_profit_pct: 3.0
  per_trade_notional: 100.0
  max_position_notional: 500.0
  max_symbols_to_buy_per_run: 1
  feature_lookback_days: 100
  validation_splits: 5
  # Gap between train folds and validation folds. 1 day leaks when features
  # use multi-day rolling windows that span the fold boundary. 5 days is the
  # minimum to avoid lookahead with the 3-day prediction horizon.
  validation_gap_days: 10
  random_state: 42
  ml_trades_file: logs/ml_backtest_trades.csv
  optimizer_results_file: logs/ml_parameter_optimization.csv
  optimizer_return_drawdown_penalty: 1.5
  optimizer_trade_penalty: 0.05
  optimizer_max_trials: 80
  walk_forward_retrain_days: 15
  walk_forward_training_lookback_days: 1460
  buy_probability_grid: [0.55, 0.60, 0.65, 0.70]
  sell_probability_grid: [0.25, 0.30, 0.35, 0.40]
  # Optimizer sweeps fixed-dollar sizing; code disables percent sizing during trials.
  per_trade_notional_grid: [50.0, 100.0]
  max_position_notional_grid: [250.0, 500.0, 1000.0]
  max_symbols_to_buy_per_run_grid: [1, 2]
  stop_loss_pct_grid: [6.0, 8.0, 10.0]
  trailing_stop_pct_grid: [12.0, 18.0, 25.0]

intraday:
  entry_time: "09:45"
  exit_time: "15:55"
  per_trade_notional: 250.0
  min_open_gain_pct: 1.0
  max_open_gain_pct: 4.0
  relative_volume_min: 1.5
  average_volume_lookback_days: 20
  stop_loss_pct: 0.5
  take_profit_pct: 1.0
  trades_file: logs/intraday_backtest_trades.csv

sector_allocator:
  entry_time: "10:00"
  exit_time: "15:55"
  sector_lookback_days: 5
  min_sector_lookback_return_pct: 0.5
  max_symbols_per_day: 1
  base_notional: 4500.0
  max_notional_per_trade: 4500.0
  max_total_notional: 4500.0
  min_open_gain_pct: 0.25
  max_open_gain_pct: 5.0
  relative_volume_min: 1.2
  average_volume_lookback_days: 20
  stop_loss_pct: 3.0
  first_take_profit_pct: 1.0
  final_take_profit_pct: 8.0
  partial_exit_fraction: 0.5
  trades_file: logs/sector_allocator_trades.csv

sector_swing_allocator:
  sector_lookback_days: 5
  min_sector_return_pct: 0.5
  momentum_lookback_days: 20
  fast_momentum_days: 5
  min_symbol_momentum_pct: 0.0
  max_symbols: 1
  max_total_exposure: 4500.0
  rebalance_days: 3
  trailing_stop_pct: 20.0
  trades_file: logs/sector_swing_trades.csv

sector_balanced_allocator:
  core_swing_exposure: 5000.0
  confirmed_intraday_exposure: 4500.0
  exposure_usage_pct: 0.95

adaptive_semis_allocator:
  max_total_exposure: 4500.0
  max_symbols: 3
  rebalance_days: 5
  sector_lookback_days: 20
  sector_slow_lookback_days: 63
  min_sector_return_pct: 0.0
  min_sector_slow_return_pct: -2.0
  risk_off_sector_return_pct: -5.0
  sector_drawdown_lookback_days: 63
  max_sector_drawdown_pct: -12.0
  risk_filter_symbols: [QQQ, SPY]
  market_momentum_lookback_days: 20
  market_sma_days: 50
  min_market_momentum_pct: -2.0
  require_market_above_sma: true
  momentum_lookback_days: 63
  fast_momentum_days: 10
  min_symbol_momentum_pct: 0.0
  min_trade_notional: 100.0
  retain_winners: true
  retain_min_profit_pct: 7.5
  retain_min_fast_momentum_pct: -3.0
  retain_min_slow_momentum_pct: 5.0
  trailing_stop_pct: 13.0
  trailing_stop_pct_bull: 17.0
  trailing_wide_min_profit_pct: 12.0
  hard_stop_pct: 12.0
  regime_filter_enabled: true
  regime_sma_fast_days: 50
  regime_sma_slow_days: 200
  neutral_sizing_pct: 0.5
  bear_block_entries: true
  symbol_sma_filter_days: 50
  use_sma_alignment: true
  use_relative_strength: true
  use_trend_consistency: true
  use_momentum_acceleration: false
  momentum_acceleration_weight: 6.0
  score_proportional_sizing: true
  bull_exposure_pct: 0.80
  bull_max_symbols: 5
  rebalance_days_bull: 3
  bull_drawdown_cap_pct: 10.0
  atr_sizing_enabled: true
  atr_lookback_days: 14
  trades_file: logs/adaptive_semis_trades.csv
